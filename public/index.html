<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NerdzStatz | Professional Football Analytics</title>
    
    <!-- Google Fonts - Professional Statistics Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        :root {
            /* Professional White & Black Theme - Light Mode */
            --bg-primary: #ffffff;
            --bg-secondary: #fafafa;
            --bg-card: #ffffff;
            --bg-card-hover: #f5f5f5;
            --bg-accent: #f0f0f0;
            
            /* Text colors */
            --text-primary: #1a1a1a;
            --text-secondary: #4a4a4a;
            --text-muted: #8a8a8a;
            
            /* Accent colors - minimal, professional */
            --accent-primary: #1a1a1a;
            --accent-secondary: #4a4a4a;
            --accent-tertiary: #6a6a6a;
            --accent-warning: #d97706;
            --accent-danger: #dc2626;
            --accent-success: #16a34a;
            
            /* Team colors - subtle blue and charcoal */
            --home-color: #2563eb;
            --away-color: #1a1a1a;
            --draw-color: #6b7280;
            
            /* Gradients - subtle */
            --gradient-primary: linear-gradient(135deg, #1a1a1a 0%, #4a4a4a 100%);
            --gradient-card: linear-gradient(145deg, #ffffff, #fafafa);
            
            /* Shadows - subtle and professional */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.1);
            --shadow-glow: 0 0 0 1px rgba(0, 0, 0, 0.1);
            
            /* Border */
            --border-color: #e5e5e5;
            --border-hover: #1a1a1a;
            
            /* Spacing */
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-2xl: 3rem;
            
            /* Border radius */
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            --radius-xl: 12px;
        }

        /* Dark Mode Theme */
        [data-theme="dark"] {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111118;
            --bg-card: #16161d;
            --bg-card-hover: #1e1e27;
            --bg-accent: #22222c;
            
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a8;
            --text-muted: #6a6a75;
            
            --accent-primary: #f5f5f5;
            --accent-secondary: #a0a0a8;
            --accent-tertiary: #7a7a85;
            --accent-warning: #fbbf24;
            --accent-danger: #ef4444;
            --accent-success: #22c55e;
            
            --home-color: #3b82f6;
            --away-color: #f5f5f5;
            --draw-color: #9ca3af;
            
            --gradient-primary: linear-gradient(135deg, #f5f5f5 0%, #a0a0a8 100%);
            --gradient-card: linear-gradient(145deg, #16161d, #111118);
            
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 0 1px rgba(255, 255, 255, 0.1);
            
            --border-color: #2a2a35;
            --border-hover: #f5f5f5;
        }

        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            font-feature-settings: 'tnum' on, 'lnum' on;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        .app-container {
            display: grid;
            grid-template-columns: 340px 1fr;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow: hidden;
        }

        .sidebar-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--text-primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .logo-subtitle {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        /* Theme Toggle */
        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: var(--bg-accent);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1rem;
        }

        .theme-toggle:hover {
            background: var(--bg-card-hover);
            border-color: var(--text-muted);
        }

        .theme-toggle .icon-sun,
        .theme-toggle .icon-moon {
            display: none;
        }

        [data-theme="light"] .theme-toggle .icon-moon,
        :root:not([data-theme]) .theme-toggle .icon-moon {
            display: block;
        }

        [data-theme="dark"] .theme-toggle .icon-sun {
            display: block;
        }

        /* Sidebar Header Actions */
        .sidebar-header-actions {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .sidebar-close-btn {
            display: none;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: var(--bg-accent);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .sidebar-close-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--text-muted);
            color: var(--text-primary);
        }

        @media (max-width: 1024px) {
            .sidebar-close-btn {
                display: flex;
            }
        }

        /* League Navigation */
        .league-nav {
            padding: var(--spacing-md);
        }

        .league-nav-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: var(--spacing-sm);
            padding: 0 var(--spacing-sm);
            font-weight: 600;
        }

        .league-btn {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            width: 100%;
            padding: var(--spacing-md);
            background: transparent;
            border: none;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: left;
            min-height: 44px; /* Touch-friendly target */
        }

        .league-btn:hover {
            background: var(--bg-accent);
            color: var(--text-primary);
        }

        .league-btn.active {
            background: var(--text-primary);
            color: var(--bg-primary);
            font-weight: 600;
        }

        .league-btn-emoji {
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
        }

        /* Fixtures List */
        .fixtures-container {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-md);
            -webkit-overflow-scrolling: touch; /* Smooth scrolling on iOS */
            overscroll-behavior: contain;
        }

        .fixtures-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-md);
            padding: 0 var(--spacing-sm);
        }

        .fixtures-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .fixtures-count {
            font-size: 0.7rem;
            font-family: 'IBM Plex Mono', monospace;
            color: var(--text-primary);
            background: var(--bg-accent);
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            font-weight: 500;
        }

        .fixture-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-sm);
            cursor: pointer;
            transition: all 0.15s ease;
            min-height: 60px; /* Touch-friendly */
        }

        .fixture-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--text-muted);
        }

        .fixture-card:active {
            transform: scale(0.98);
        }

        .fixture-card.active {
            border-color: var(--text-primary);
            box-shadow: var(--shadow-md);
        }

        .fixture-date {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: var(--spacing-sm);
            font-family: 'IBM Plex Mono', monospace;
        }

        .fixture-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-sm);
        }

        .fixture-team {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .fixture-team.away {
            flex-direction: row-reverse;
            text-align: right;
        }

        .fixture-team-logo {
            width: 24px;
            height: 24px;
            min-width: 24px;
            object-fit: contain;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .fixture-team-name {
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }

        .fixture-vs {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 600;
            flex-shrink: 0;
            padding: 0 var(--spacing-xs);
        }

        .fixture-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-top: var(--spacing-sm);
            font-size: 0.65rem;
            color: var(--accent-success);
            font-weight: 500;
        }

        .fixture-status.pending {
            color: var(--text-muted);
        }

        .status-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
        }

        /* Main Content */
        .main-content {
            padding: var(--spacing-xl);
            background: var(--bg-primary);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            text-align: center;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: var(--spacing-lg);
            opacity: 0.3;
        }

        .empty-state-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
        }

        .empty-state-desc {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* Match Header */
        .match-header {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-xl);
        }

        .match-meta {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'IBM Plex Mono', monospace;
        }

        .match-meta-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }

        .match-teams-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-2xl);
        }

        .match-team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-md);
            flex: 1;
            max-width: 200px;
        }

        .match-team-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
        }

        .match-team-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.125rem;
            font-weight: 600;
            text-align: center;
            color: var(--text-primary);
        }

        .match-vs {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .match-vs-text {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.1em;
        }

        .prediction-summary {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            margin-top: var(--spacing-sm);
        }

        .prediction-summary-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .prediction-summary-text strong {
            color: var(--text-primary);
        }

        /* KPI Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            transition: all 0.15s ease;
        }

        .kpi-card:hover {
            border-color: var(--text-muted);
            box-shadow: var(--shadow-sm);
        }

        .kpi-card.kpi-highlight {
            border-color: var(--accent-success);
            background: linear-gradient(135deg, var(--bg-card), rgba(22, 163, 74, 0.05));
            box-shadow: 0 0 0 1px rgba(22, 163, 74, 0.2);
        }

        .kpi-card.kpi-highlight .kpi-label::after {
            content: ' ✓';
            color: var(--accent-success);
        }

        .kpi-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: var(--spacing-sm);
            font-weight: 600;
        }

        .kpi-value {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .kpi-value.home { color: var(--home-color); }
        .kpi-value.draw { color: var(--draw-color); }
        .kpi-value.away { color: var(--text-primary); }

        .kpi-subtitle {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: var(--spacing-xs);
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: var(--spacing-lg);
        }

        .dash-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .dash-card.span-4 { grid-column: span 4; }
        .dash-card.span-6 { grid-column: span 6; }
        .dash-card.span-8 { grid-column: span 8; }
        .dash-card.span-12 { grid-column: span 12; }

        .dash-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-md) var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }

        .dash-card-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dash-card-title-icon {
            opacity: 0.6;
            font-size: 0.9rem;
        }

        .dash-card-badge {
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            background: var(--bg-accent);
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dash-card-body {
            padding: var(--spacing-lg);
        }

        /* Probability Bars */
        .outcome-bar {
            margin-bottom: var(--spacing-md);
        }

        .outcome-bar:last-child {
            margin-bottom: 0;
        }

        .outcome-bar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-xs);
        }

        .outcome-bar-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .outcome-bar-value {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .outcome-bar-track {
            height: 6px;
            background: var(--bg-accent);
            border-radius: 3px;
            overflow: hidden;
        }

        .outcome-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.8s ease;
        }

        .outcome-bar-fill.home { background: var(--home-color); }
        .outcome-bar-fill.draw { background: var(--draw-color); }
        .outcome-bar-fill.away { background: var(--text-primary); }

        /* Scoreline Grid */
        .scoreline-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
            gap: var(--spacing-sm);
        }

        .scoreline-item {
            text-align: center;
            padding: var(--spacing-md);
            background: var(--bg-accent);
            border-radius: var(--radius-sm);
            transition: all 0.15s ease;
            border: 1px solid transparent;
        }

        .scoreline-item:first-child {
            background: var(--text-primary);
            color: var(--bg-primary);
            border-color: var(--text-primary);
        }

        .scoreline-item:first-child .scoreline-score {
            color: var(--bg-primary);
        }

        .scoreline-item:first-child .scoreline-prob {
            color: var(--bg-primary);
            opacity: 0.7;
        }

        .scoreline-item:hover {
            border-color: var(--text-muted);
        }

        .scoreline-score {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            display: block;
            margin-bottom: 4px;
        }

        .scoreline-prob {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* xG Comparison */
        .xg-comparison {
            display: flex;
            align-items: stretch;
            gap: var(--spacing-lg);
        }

        .xg-team {
            flex: 1;
            text-align: center;
            padding: var(--spacing-lg);
            background: var(--bg-accent);
            border-radius: var(--radius-md);
        }

        .xg-team-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: var(--spacing-sm);
            font-weight: 600;
        }

        .xg-team-value {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 2rem;
            font-weight: 600;
        }

        .xg-team-value.home { color: var(--home-color); }
        .xg-team-value.away { color: var(--text-primary); }

        .xg-delta {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-md);
        }

        .xg-delta-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .xg-delta-value {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Confidence Meter */
        .confidence-meter {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
        }

        .confidence-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: conic-gradient(
                var(--text-primary) calc(var(--confidence) * 3.6deg),
                var(--bg-accent) 0
            );
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .confidence-circle::before {
            content: '';
            position: absolute;
            width: 76px;
            height: 76px;
            background: var(--bg-card);
            border-radius: 50%;
        }

        .confidence-value {
            position: relative;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .confidence-label {
            margin-top: var(--spacing-md);
            font-size: 0.7rem;
            font-weight: 600;
            padding: var(--spacing-xs) var(--spacing-md);
            border-radius: var(--radius-sm);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .confidence-label.high {
            background: rgba(22, 163, 74, 0.1);
            color: var(--accent-success);
        }

        .confidence-label.moderate {
            background: rgba(217, 119, 6, 0.1);
            color: var(--accent-warning);
        }

        .confidence-label.low {
            background: rgba(220, 38, 38, 0.1);
            color: var(--accent-danger);
        }

        /* Betting Odds Comparison */
        .odds-comparison {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .odds-table {
            width: 100%;
            border-collapse: collapse;
        }

        .odds-table th,
        .odds-table td {
            padding: var(--spacing-sm) var(--spacing-md);
            text-align: center;
            font-size: 0.8rem;
        }

        .odds-table th {
            background: var(--bg-accent);
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.7rem;
        }

        .odds-table th:first-child {
            text-align: left;
            border-radius: var(--radius-sm) 0 0 var(--radius-sm);
        }

        .odds-table th:last-child {
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }

        .odds-table td {
            border-bottom: 1px solid var(--border-color);
        }

        .odds-table tr:last-child td {
            border-bottom: none;
        }

        .odds-bookmaker {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            text-align: left;
            font-weight: 500;
        }

        .odds-bookmaker-logo {
            width: 20px;
            height: 20px;
            border-radius: var(--radius-sm);
            background: var(--bg-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .odds-value {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            color: var(--text-primary);
        }

        .odds-value.best {
            color: var(--accent-success);
            background: rgba(22, 163, 74, 0.1);
            border-radius: var(--radius-sm);
            padding: 2px 6px;
        }

        .odds-prob {
            font-size: 0.65rem;
            color: var(--text-muted);
            display: block;
            margin-top: 2px;
        }

        .odds-disclaimer {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-align: center;
            padding-top: var(--spacing-sm);
            border-top: 1px solid var(--border-color);
            margin-top: var(--spacing-sm);
        }

        .odds-mock-badge {
            display: inline-block;
            font-size: 0.6rem;
            padding: 2px 6px;
            background: var(--accent-warning);
            color: var(--bg-primary);
            border-radius: var(--radius-sm);
            margin-left: var(--spacing-sm);
            font-weight: 600;
        }

        /* Analysis Section - Professional Report Style */
        .analysis-content {
            font-size: 0.875rem;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .analysis-section {
            margin-bottom: var(--spacing-2xl);
            padding-bottom: var(--spacing-xl);
            border-bottom: 1px solid var(--border-color);
        }

        .analysis-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .analysis-section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-md);
            padding-top: var(--spacing-sm);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .analysis-section-title::before {
            content: '';
            width: 3px;
            height: 14px;
            background: var(--text-primary);
            border-radius: 2px;
        }

        /* Methodology Section */
        .methodology-container {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .methodology-intro {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.6;
            padding: var(--spacing-md);
            background: var(--bg-accent);
            border-radius: var(--radius-md);
            border-left: 3px solid var(--text-primary);
        }

        .formula-block {
            background: var(--bg-accent);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            overflow-x: auto;
        }

        .formula-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: var(--spacing-sm);
        }

        .formula-math {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-primary);
            padding: var(--spacing-sm) 0;
            line-height: 1.8;
        }

        .formula-math .var {
            color: var(--home-color);
            font-style: italic;
        }

        .formula-math .symbol {
            color: var(--text-muted);
            padding: 0 var(--spacing-xs);
        }

        .formula-math .num {
            color: var(--accent-warning);
        }

        .methodology-step {
            padding: var(--spacing-md);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
        }

        .methodology-step-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-sm);
        }

        .methodology-step-number {
            width: 24px;
            height: 24px;
            background: var(--text-primary);
            color: var(--bg-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .methodology-step-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .methodology-step-content {
            font-size: 0.75rem;
            color: var(--text-secondary);
            line-height: 1.6;
            padding-left: 32px;
        }

        .methodology-step-content code {
            font-family: 'IBM Plex Mono', monospace;
            background: var(--bg-accent);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.7rem;
        }

        .calc-breakdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-md);
            margin-top: var(--spacing-md);
        }

        .calc-item {
            background: var(--bg-accent);
            padding: var(--spacing-md);
            border-radius: var(--radius-sm);
        }

        .calc-item-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .calc-item-formula {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .calc-item-result {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .calc-item-result.home { color: var(--home-color); }
        .calc-item-result.away { color: var(--text-primary); }

        .model-params {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
        }

        .model-param {
            padding: var(--spacing-sm);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            text-align: center;
        }

        .model-param-name {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .model-param-value {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Chart Canvas */
        .chart-container {
            position: relative;
            height: 250px;
        }

        /* Loading State */
        .loading-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-2xl);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid var(--border-color);
            border-top-color: var(--text-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: var(--spacing-md);
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Team Comparison Bars */
        .comparison-bar {
            margin-bottom: var(--spacing-lg);
        }

        .comparison-bar-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: var(--spacing-xs);
            font-weight: 600;
        }

        .comparison-bar-track {
            display: flex;
            height: 28px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--bg-accent);
        }

        .comparison-bar-fill {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            font-weight: 600;
            color: white;
            transition: width 0.8s ease;
        }

        .comparison-bar-fill.home {
            background: var(--home-color);
        }

        .comparison-bar-fill.away {
            background: var(--text-primary);
        }

        /* Goal Distribution */
        .goal-dist-container {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .goal-dist-team {
            padding: var(--spacing-md);
            background: var(--bg-accent);
            border-radius: var(--radius-md);
        }

        .goal-dist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-sm);
        }

        .goal-dist-team-name {
            font-size: 0.75rem;
            font-weight: 600;
        }

        .goal-dist-team-name.home { color: var(--home-color); }
        .goal-dist-team-name.away { color: var(--text-primary); }

        .goal-dist-xg {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .goal-dist-bars {
            display: flex;
            gap: 6px;
            align-items: flex-end;
            height: 80px;
            padding-top: 10px;
        }

        .goal-dist-bar {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-height: 100%;
        }

        .goal-dist-bar-wrapper {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 60px;
        }

        .goal-dist-bar-fill {
            width: 100%;
            border-radius: 2px 2px 0 0;
            transition: height 0.5s ease;
            min-height: 4px;
        }

        .goal-dist-bar-fill.home { background: var(--home-color); }
        .goal-dist-bar-fill.away { background: var(--text-primary); }

        .goal-dist-bar-prob {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.55rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 2px;
        }

        .goal-dist-bar-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Market Comparison */
        .market-comparison {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: var(--spacing-lg);
            align-items: start;
        }

        .market-column {
            text-align: center;
        }

        .market-column-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: var(--spacing-md);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-xs);
            font-weight: 600;
        }

        .market-column-title.model { color: var(--text-primary); }
        .market-column-title.external { color: var(--text-secondary); }

        .market-values {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .market-value-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-sm);
            background: var(--bg-accent);
            border-radius: var(--radius-sm);
        }

        .market-value-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .market-value-num {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .market-value-num.home { color: var(--home-color); }
        .market-value-num.draw { color: var(--draw-color); }
        .market-value-num.away { color: var(--text-primary); }

        .market-divider {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-md);
            padding-top: 30px;
        }

        .market-divider-text {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .market-diff {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .market-diff-item {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
        }

        .market-diff-item.positive {
            background: rgba(22, 163, 74, 0.1);
            color: var(--accent-success);
        }

        .market-diff-item.negative {
            background: rgba(220, 38, 38, 0.1);
            color: var(--accent-danger);
        }

        .market-diff-item.neutral {
            background: var(--bg-accent);
            color: var(--text-muted);
        }

        /* Form Trend */
        .form-trend-container {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .form-team-row {
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--bg-accent);
            border-radius: var(--radius-sm);
        }

        .form-team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-sm);
        }

        .form-team-name {
            font-size: 0.75rem;
            font-weight: 600;
        }

        .form-team-name.home { color: var(--home-color); }
        .form-team-name.away { color: var(--text-primary); }

        .form-team-stats {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .form-results {
            display: flex;
            gap: 4px;
        }

        .form-result {
            width: 26px;
            height: 26px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.6rem;
            font-weight: 600;
            color: white;
        }

        .form-result.W { background: var(--accent-success); }
        .form-result.D { background: var(--draw-color); }
        .form-result.L { background: var(--accent-danger); }

        /* Team Stats Grid */
        .team-stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--spacing-sm);
        }

        .team-stat-item {
            background: var(--bg-accent);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .team-stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .team-stat-values {
            display: flex;
            gap: var(--spacing-md);
        }

        .team-stat-value {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .team-stat-value.home { color: var(--home-color); }
        .team-stat-value.away { color: var(--text-primary); }

        /* Injury Impact */
        .injury-impact-container {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .injury-team {
            padding: var(--spacing-md);
            background: var(--bg-accent);
            border-radius: var(--radius-sm);
        }

        .injury-team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-sm);
        }

        .injury-team-name {
            font-size: 0.75rem;
            font-weight: 600;
        }

        .injury-team-name.home { color: var(--home-color); }
        .injury-team-name.away { color: var(--text-primary); }

        .injury-impact-badge {
            font-size: 0.55rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .injury-impact-badge.low {
            background: rgba(22, 163, 74, 0.1);
            color: var(--accent-success);
        }

        .injury-impact-badge.moderate {
            background: rgba(217, 119, 6, 0.1);
            color: var(--accent-warning);
        }

        .injury-impact-badge.severe {
            background: rgba(220, 38, 38, 0.1);
            color: var(--accent-danger);
        }

        .injury-stats {
            display: flex;
            gap: var(--spacing-md);
        }

        .injury-stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .injury-stat-label {
            font-size: 0.55rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .injury-stat-value {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .injury-stat-value.danger {
            color: var(--accent-danger);
        }

        /* Head to Head */
        .h2h-container {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .h2h-summary {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: var(--spacing-md);
            background: var(--bg-accent);
            border-radius: var(--radius-md);
        }

        .h2h-stat {
            text-align: center;
        }

        .h2h-stat-value {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .h2h-stat-value.home { color: var(--home-color); }
        .h2h-stat-value.draw { color: var(--draw-color); }
        .h2h-stat-value.away { color: var(--text-primary); }

        .h2h-stat-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
            font-weight: 500;
        }

        .h2h-matches {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 150px;
            overflow-y: auto;
        }

        .h2h-match {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--bg-accent);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
        }

        .h2h-match-teams {
            flex: 1;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .h2h-match-score {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
        }

        .h2h-match-date {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.6rem;
            color: var(--text-muted);
        }

        /* Fun Facts */
        .fun-facts-container {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .fun-fact {
            display: flex;
            align-items: flex-start;
            gap: var(--spacing-sm);
            padding: var(--spacing-md);
            background: var(--bg-accent);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--text-primary);
        }

        .fun-fact-icon {
            font-size: 1rem;
            flex-shrink: 0;
        }

        .fun-fact-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .fun-fact-text strong {
            color: var(--text-primary);
        }

        .fun-fact-text .highlight {
            color: var(--text-primary);
            font-weight: 600;
        }

        .fun-fact.home-advantage {
            border-left-color: var(--home-color);
        }

        .fun-fact.away-advantage {
            border-left-color: var(--text-primary);
        }

        .fun-fact.neutral {
            border-left-color: var(--draw-color);
        }

        /* Fixture Congestion */
        .congestion-container {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .congestion-team {
            padding: var(--spacing-md);
            background: var(--bg-accent);
            border-radius: var(--radius-md);
        }

        .congestion-team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-sm);
        }

        .congestion-team-name {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .congestion-level-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .congestion-level-badge.low {
            background: rgba(22, 163, 74, 0.1);
            color: var(--accent-success);
        }

        .congestion-level-badge.moderate {

        /* Tabs */

        /* Responsive */

        /* Hamburger menu for mobile */

        /* Markets Grid */

            font-family: 'IBM Plex Mono', monospace;

            font-weight: 600;
            color: var(--text-primary);

    </style>
</head>
<body>
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
    
    <div class="mobile-header">
        <button class="menu-btn" onclick="toggleSidebar()" aria-label="Open menu">☰</button>
        <div class="logo">
            <div class="logo-icon">⚽</div>
            <div>
                <div class="logo-text">NerdzStatz</div>
            </div>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
            <span class="theme-icon">🌙</span>
        </button>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">⚽</div>
                    <div>
                        <div class="logo-text">NerdzStatz</div>
                        <div class="logo-subtitle">Professional Analytics</div>
                    </div>
                </div>
                <div class="sidebar-header-actions">
                    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark/light mode">
                        <span class="icon-sun">☀️</span>
                        <span class="icon-moon">🌙</span>
                    </button>
                    <button class="sidebar-close-btn" onclick="closeSidebar()" aria-label="Close menu">✕</button>
                </div>
            </div>

            <nav class="league-nav">
                <div class="league-nav-title">Competitions</div>
                <button class="league-btn active" data-league="epl">
                    <span class="league-btn-emoji">🏴󠁧󠁢󠁥󠁮󠁧󠁿</span>
                    <span>Premier League</span>
                </button>
                <button class="league-btn" data-league="laliga">
                    <span class="league-btn-emoji">🇪🇸</span>
                    <span>La Liga</span>
                </button>
                <button class="league-btn" data-league="bundesliga">
                    <span class="league-btn-emoji">🇩🇪</span>
                    <span>Bundesliga</span>
                </button>
                <button class="league-btn" data-league="seriea">
                    <span class="league-btn-emoji">🇮🇹</span>
                    <span>Serie A</span>
                </button>
                <button class="league-btn" data-league="ligue1">
                    <span class="league-btn-emoji">🇫🇷</span>
                    <span>Ligue 1</span>
                </button>
                <button class="league-btn" data-league="ucl">
                    <span class="league-btn-emoji">⭐</span>
                    <span>Champions League</span>
                </button>
                <button class="league-btn" data-league="europa">
                    <span class="league-btn-emoji">🏆</span>
                    <span>Europa League</span>
                </button>
            </nav>

            <div class="fixtures-container" id="fixtures-container">
                <div class="fixtures-header">
                    <span class="fixtures-title">Upcoming Matches</span>
                    <span class="fixtures-count" id="fixtures-count">0</span>
                </div>
                <div id="fixtures-list">
                    <div class="loading-overlay">
                        <div class="spinner"></div>
                        <div class="loading-text">Loading fixtures...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="main-content">
            <div class="empty-state">
                <div class="empty-state-icon">📊</div>
                <div class="empty-state-title">Select a Match</div>
                <div class="empty-state-desc">Choose a match from the sidebar to view detailed analysis and predictions</div>
            </div>
        </main>
    </div>

    <script>
        // State
        const state = {
            currentLeague: 'epl',
            fixtures: [],
            selectedFixture: null,
            prediction: null,
            charts: {}
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setupLeagueNav();
            loadFixtures(state.currentLeague);
        });

        // Setup league navigation
        function setupLeagueNav() {
            document.querySelectorAll('.league-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.league-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.currentLeague = btn.dataset.league;
                    loadFixtures(state.currentLeague);
                    closeSidebar();
                });
            });
        }

        // Load fixtures
        async function loadFixtures(league) {
            const container = document.getElementById('fixtures-list');
            container.innerHTML = `
                <div class="loading-overlay">
                    <div class="spinner"></div>
                    <div class="loading-text">Loading fixtures...</div>
                </div>
            `;

            try {
                const response = await fetch(`/api/fixtures/${league}`);
                const fixtures = await response.json();
                state.fixtures = fixtures;

                document.getElementById('fixtures-count').textContent = fixtures.length;

                if (fixtures.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state" style="height: auto; padding: 2rem 0;">
                            <div class="empty-state-icon" style="font-size: 2rem;">📅</div>
                            <div class="empty-state-desc">No upcoming fixtures</div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = fixtures.map(fixture => createFixtureCard(fixture)).join('');

                // Check prediction status for all fixtures
                checkPredictionStatuses(fixtures);

                // Auto-select first fixture
                if (fixtures.length > 0 && !state.selectedFixture) {
                    selectFixture(fixtures[0]);
                }
            } catch (error) {
                console.error('Error loading fixtures:', error);
                container.innerHTML = `
                    <div class="empty-state" style="height: auto; padding: 2rem 0;">
                        <div class="empty-state-icon" style="font-size: 2rem;">⚠️</div>
                        <div class="empty-state-desc">Error loading fixtures</div>
                    </div>
                `;
            }
        }

        // Create fixture card
        function createFixtureCard(fixture) {
            const date = new Date(fixture.fixture.date);
            const dateStr = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            
            // Better truncation for team names - use shorter length for sidebar
            const homeName = truncate(fixture.teams.home.name, 14);
            const awayName = truncate(fixture.teams.away.name, 14);
            
            return `
                <div class="fixture-card" data-id="${fixture.fixture.id}" onclick="selectFixtureById(${fixture.fixture.id})">
                    <div class="fixture-date">${dateStr} • ${timeStr}</div>
                    <div class="fixture-teams">
                        <div class="fixture-team">
                            <img src="${fixture.teams.home.logo}" alt="" class="fixture-team-logo" onerror="this.style.display='none'">
                            <span class="fixture-team-name" title="${fixture.teams.home.name}">${homeName}</span>
                        </div>
                        <span class="fixture-vs">vs</span>
                        <div class="fixture-team away">
                            <img src="${fixture.teams.away.logo}" alt="" class="fixture-team-logo" onerror="this.style.display='none'">
                            <span class="fixture-team-name" title="${fixture.teams.away.name}">${awayName}</span>
                        </div>
                    </div>
                    <div class="fixture-status pending" id="status-${fixture.fixture.id}">
                        <span class="status-dot"></span>
                        <span>Checking...</span>
                    </div>
                </div>
            `;
        }

        // Check prediction status for all fixtures
        async function checkPredictionStatuses(fixtures) {
            for (const fixture of fixtures) {
                try {
                    const response = await fetch(`/api/predictions/${fixture.fixture.id}`, { method: 'HEAD' });
                    const status = document.getElementById(`status-${fixture.fixture.id}`);
                    if (status) {
                        if (response.ok) {
                            status.innerHTML = `<span class="status-dot"></span><span>Analysis Ready</span>`;
                            status.classList.remove('pending');
                        } else {
                            status.innerHTML = `<span class="status-dot"></span><span>Pending</span>`;
                            status.classList.add('pending');
                        }
                    }
                } catch (error) {
                    // Silently fail for status checks
                }
            }
        }

        // Select fixture by ID
        function selectFixtureById(id) {
            const fixture = state.fixtures.find(f => f.fixture.id === id);
            if (fixture) {
                selectFixture(fixture);
            }
        }

        // Select fixture
        async function selectFixture(fixture) {
            state.selectedFixture = fixture;
            
            // Update active state
            document.querySelectorAll('.fixture-card').forEach(card => {
                card.classList.remove('active');
                if (parseInt(card.dataset.id) === fixture.fixture.id) {
                    card.classList.add('active');
                }
            });

            // Show loading state
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="loading-overlay" style="height: 60vh;">
                    <div class="spinner"></div>
                    <div class="loading-text">Loading prediction data...</div>
                </div>
            `;

            // Close sidebar on mobile
            closeSidebar();

            // Load prediction
            try {
                const response = await fetch(`/api/predictions/${fixture.fixture.id}`);
                
                if (response.ok) {
                    const data = await response.json();
                    state.prediction = data;
                    renderPrediction(fixture, data);
                    
                    // Update fixture status
                    const status = document.getElementById(`status-${fixture.fixture.id}`);
                    if (status) {
                        status.innerHTML = `<span class="status-dot"></span><span>Analysis Ready</span>`;
                        status.classList.remove('pending');
                    }
                } else {
                    renderNoPrediction(fixture);
                    
                    // Update fixture status
                    const status = document.getElementById(`status-${fixture.fixture.id}`);
                    if (status) {
                        status.innerHTML = `<span class="status-dot"></span><span>Pending</span>`;
                        status.classList.add('pending');
                    }
                }
            } catch (error) {
                console.error('Error loading prediction:', error);
                renderNoPrediction(fixture);
            }
        }

        // Render prediction
        function renderPrediction(fixture, data) {
            const main = document.getElementById('main-content');
            const metrics = data.calculatedMetrics || data.metadata?.calculatedMetrics || {};
            const predictions = metrics.predictions || {};
            const xG = metrics.xG || {};
            const confidence = metrics.confidence || data.metadata?.confidence || { percentage: '70%', level: 'MODERATE' };

            main.innerHTML = `
                <!-- Match Header -->
                <div class="match-header">
                    <div class="match-meta">
                        <div class="match-meta-item">
                            <span>📍</span>
                            <span>${fixture.fixture.venue?.name || 'TBD'}</span>
                        </div>
                        <div class="match-meta-item">
                            <span>📅</span>

        // Load and render bookmaker odds
        async function loadBookmakerOdds(fixture) {
            const container = document.getElementById('bookmaker-odds-container');
            if (!container) return;

            try {
                const homeTeam = encodeURIComponent(fixture.teams.home.name);
                const awayTeam = encodeURIComponent(fixture.teams.away.name);
                const response = await fetch(`/api/odds/${homeTeam}/${awayTeam}?league=epl`);
                
                if (response.ok) {
                    const oddsData = await response.json();
                    container.innerHTML = renderBookmakerOdds(oddsData, fixture);
                } else {
                    container.innerHTML = `
                        <p style="color: var(--text-muted); text-align: center; padding: var(--spacing-md);">
                            Odds not available for this fixture
                        </p>
                    `;
                }
            } catch (error) {
                console.error('Error loading odds:', error);
                container.innerHTML = `
                    <p style="color: var(--text-muted); text-align: center; padding: var(--spacing-md);">
                        Unable to load bookmaker odds
                    </p>
                `;
            }
        }

        // Render bookmaker odds table
        function renderBookmakerOdds(oddsData, fixture) {
            if (!oddsData || !oddsData.bookmakers || Object.keys(oddsData.bookmakers).length === 0) {
                return '<p style="color: var(--text-muted); text-align: center;">No odds available</p>';
            }

            const bookmakers = oddsData.bookmakers;
            const homeName = fixture.teams.home.name.split(' ').pop(); // Short name
            const awayName = fixture.teams.away.name.split(' ').pop();

            // Find best odds for each outcome
            let bestHome = 0, bestDraw = 0, bestAway = 0;
            Object.values(bookmakers).forEach(bm => {
                const homeDecimal = parseFloat(bm.home.decimal);
                const drawDecimal = parseFloat(bm.draw.decimal);
                const awayDecimal = parseFloat(bm.away.decimal);
                if (homeDecimal > bestHome) bestHome = homeDecimal;
                if (drawDecimal > bestDraw) bestDraw = drawDecimal;
                if (awayDecimal > bestAway) bestAway = awayDecimal;
            });

            const rows = Object.entries(bookmakers).map(([key, bm]) => {
                const homeDecimal = parseFloat(bm.home.decimal);
                const drawDecimal = parseFloat(bm.draw.decimal);
                const awayDecimal = parseFloat(bm.away.decimal);
                
                return `
                    <tr>
                        <td>
                            <div class="odds-bookmaker">
                                <span class="odds-bookmaker-logo">${bm.name.charAt(0)}</span>
                                <span>${bm.name}</span>
                            </div>
                        </td>
                        <td>
                            <span class="odds-value ${homeDecimal >= bestHome ? 'best' : ''}">${bm.home.american}</span>
                            <span class="odds-prob">${bm.home.probability}%</span>
                        </td>
                        <td>
                            <span class="odds-value ${drawDecimal >= bestDraw ? 'best' : ''}">${bm.draw.american}</span>
                            <span class="odds-prob">${bm.draw.probability}%</span>
                        </td>
                        <td>
                            <span class="odds-value ${awayDecimal >= bestAway ? 'best' : ''}">${bm.away.american}</span>
                            <span class="odds-prob">${bm.away.probability}%</span>
                        </td>
                    </tr>
                `;
            }).join('');

            return `
                <div class="odds-comparison">
                    <table class="odds-table">
                        <thead>
                            <tr>
                                <th>Bookmaker</th>
                                <th>${homeName}</th>
                                <th>Draw</th>
                                <th>${awayName}</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                    <div class="odds-disclaimer">
                        ${oddsData.isMockData ? '<span class="odds-mock-badge">Demo Data</span> ' : ''}
                        Odds shown for comparison only. Always verify with bookmaker.
                    </div>
                </div>
            `;
        }

        // Render outcome bars
        function renderOutcomeBars(outcomes) {
            if (!outcomes) return '<p style="color: var(--text-muted);">Data not available</p>';
            
            return `
                <div class="outcome-bar">
                    <div class="outcome-bar-header">
                        <span class="outcome-bar-label">Home Win</span>
                        <span class="outcome-bar-value" style="color: var(--home-color);">${outcomes.homeWin}%</span>
                    </div>
                    <div class="outcome-bar-track">

        // Render Market vs Model comparison with Asian odds
        function renderMarketComparison(ourPredictions, marketPredictions) {
            if (!ourPredictions?.outcomes) {
                return '<p style="color: var(--text-muted);">Model data not available</p>';
            }

            const our = ourPredictions.outcomes;
            const market = marketPredictions || {};
            
            // Parse market values (remove % if present)
            const parseVal = (val) => {
                if (!val || val === 'N/A') return null;
                return parseFloat(String(val).replace('%', ''));
            };
            
            const ourHome = parseFloat(our.homeWin) || 0;
            const ourDraw = parseFloat(our.draw) || 0;
            const ourAway = parseFloat(our.awayWin) || 0;
            
            const marketHome = parseVal(market.home);
            const marketDraw = parseVal(market.draw);
            const marketAway = parseVal(market.away);
            
            const calcDiff = (ours, theirs) => {
                if (theirs === null) return null;
                return (ours - theirs).toFixed(1);
            };
            
            const diffHome = calcDiff(ourHome, marketHome);
            const diffDraw = calcDiff(ourDraw, marketDraw);
            const diffAway = calcDiff(ourAway, marketAway);
            
            const getDiffClass = (diff) => {
                if (diff === null) return 'neutral';
                const d = parseFloat(diff);
                if (d > 3) return 'positive';
                if (d < -3) return 'negative';
                return 'neutral';
            };
            
            const formatDiff = (diff) => {
                if (diff === null) return '—';
                const d = parseFloat(diff);
                return d > 0 ? `+${diff}` : `${diff}`;
            };
            
            // Convert prob to decimal odds
            const probToOdds = (prob) => {
                if (!prob || prob <= 0) return '—';
                return (100 / prob).toFixed(2);
            };
            
            // Calculate implied Asian Handicap based on xG delta
            const xgDelta = ourPredictions.xgDelta || 0;
            const suggestedAH = xgDelta > 0.5 ? `-${Math.round(xgDelta * 2) / 2}` : 
                               xgDelta < -0.5 ? `+${Math.round(Math.abs(xgDelta) * 2) / 2}` : '0';

            return `
                <div style="display: flex; flex-direction: column; gap: var(--spacing-lg);">
                    <!-- 1X2 Comparison Table -->
                    <div>
                        <div style="font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: var(--spacing-sm); font-weight: 600;">Match Result (1X2)</div>
                        <div style="display: grid; grid-template-columns: 1fr repeat(4, auto); gap: var(--spacing-sm); font-size: 0.75rem;">
                            <div style="font-weight: 600; color: var(--text-muted);"></div>
                            <div style="text-align: center; font-weight: 600; color: var(--text-muted); font-size: 0.65rem;">MODEL</div>
                            <div style="text-align: center; font-weight: 600; color: var(--text-muted); font-size: 0.65rem;">MARKET</div>
                            <div style="text-align: center; font-weight: 600; color: var(--text-muted); font-size: 0.65rem;">DIFF</div>
                            <div style="text-align: center; font-weight: 600; color: var(--text-muted); font-size: 0.65rem;">ODDS</div>
                            
                            <div style="color: var(--home-color); font-weight: 500;">Home</div>
                            <div style="text-align: center; font-family: 'IBM Plex Mono', monospace; font-weight: 600;">${ourHome.toFixed(1)}%</div>
                            <div style="text-align: center; font-family: 'IBM Plex Mono', monospace; color: var(--text-secondary);">${marketHome !== null ? marketHome + '%' : '—'}</div>
                            <div style="text-align: center;"><span class="market-diff-item ${getDiffClass(diffHome)}">${formatDiff(diffHome)}</span></div>
                            <div style="text-align: center; font-family: 'IBM Plex Mono', monospace; color: var(--text-muted);">${probToOdds(ourHome)}</div>
                            
                            <div style="color: var(--draw-color); font-weight: 500;">Draw</div>
                            <div style="text-align: center; font-family: 'IBM Plex Mono', monospace; font-weight: 600;">${ourDraw.toFixed(1)}%</div>
                            <div style="text-align: center; font-family: 'IBM Plex Mono', monospace; color: var(--text-secondary);">${marketDraw !== null ? marketDraw + '%' : '—'}</div>
                            <div style="text-align: center;"><span class="market-diff-item ${getDiffClass(diffDraw)}">${formatDiff(diffDraw)}</span></div>

                            <div style="color: var(--text-primary); font-weight: 500;">Away</div>

                    <!-- Asian Handicap Section -->
                    <div>

                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacing-sm);">

                    <!-- Value Indicator -->

                        ${Math.abs(parseFloat(diffHome)) > 5 || Math.abs(parseFloat(diffAway)) > 5 
                            ? 'Significant model-market divergence detected. Investigate further before acting.' 
                            : 'Model aligns closely with market consensus.'}
                    </div>
                    ` : ''}

            `;
        }

        // Render Form Trend
        function renderFormTrend(homeForm, awayForm, homeName, awayName) {
            const renderFormResults = (form) => {
                if (!form || !form.matches || form.matches.length === 0) {
                    return '<span style="color: var(--text-muted); font-size: 0.75rem;">No data</span>';
                }
                
                return form.matches.slice(0, 5).map(m => `
                    <div class="form-result ${m.result}">${m.result}</div>
                `).join('');
            };
            
            const calcFormStats = (form) => {
                if (!form || !form.matches || form.matches.length === 0) {
                    return { pts: 0, gf: 0, ga: 0 };
                }
                
                let pts = 0, gf = 0, ga = 0;
                form.matches.slice(0, 5).forEach(m => {
                    if (m.result === 'W') pts += 3;
                    else if (m.result === 'D') pts += 1;
                    
                    // Parse score
                    if (m.score) {
                        const parts = m.score.split('-');
                        if (parts.length === 2) {
                            const homeGoals = parseInt(parts[0]);
                            const awayGoals = parseInt(parts[1]);
                            if (m.venue === 'H') {
                                gf += homeGoals;
                                ga += awayGoals;
                            } else {
                                gf += awayGoals;
                                ga += homeGoals;
                            }
                        }
                    }
                });
                
                return { pts, gf, ga };
            };
            
            const homeStats = calcFormStats(homeForm);
            const awayStats = calcFormStats(awayForm);

            return `
                <div class="form-trend-container">
                    <div class="form-team-row">
                        <div class="form-team-header">
                            <span class="form-team-name home">${truncate(homeName, 18)}</span>
                            <span class="form-team-stats">${homeStats.pts} pts | ${homeStats.gf}:${homeStats.ga}</span>
                        </div>
                        <div class="form-results">
                            ${renderFormResults(homeForm)}
                        </div>
                    </div>
                    <div class="form-team-row">
                        <div class="form-team-header">
                            <span class="form-team-name away">${truncate(awayName, 18)}</span>
                            <span class="form-team-stats">${awayStats.pts} pts | ${awayStats.gf}:${awayStats.ga}</span>
                        </div>
                        <div class="form-results">
                            ${renderFormResults(awayForm)}
                        </div>
                    </div>
                </div>
            `;
        }

        // Render Team Stats Comparison
        function renderTeamStatsComparison(standings, xG) {
            const home = standings?.home || {};
            const away = standings?.away || {};

            return `
                <div class="team-stats-grid">
                    <div class="team-stat-item">
                        <span class="team-stat-label">Position</span>
                        <div class="team-stat-values">
                            <span class="team-stat-value home">${home.position || 'N/A'}</span>
                            <span class="team-stat-value away">${away.position || 'N/A'}</span>

                    </div>
                    <div class="team-stat-item">
                        <span class="team-stat-label">Points</span>
                        <div class="team-stat-values">
                            <span class="team-stat-value home">${home.points || 'N/A'}</span>
                            <span class="team-stat-value away">${away.points || 'N/A'}</span>
                        </div>
                    </div>
                    <div class="team-stat-item">
                        <span class="team-stat-label">Played</span>
                        <div class="team-stat-values">
                            <span class="team-stat-value home">${home.played || 'N/A'}</span>
                            <span class="team-stat-value away">${away.played || 'N/A'}</span>

                    <div class="team-stat-item">

                        <div class="team-stat-values">

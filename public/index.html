                            <span class="team-stat-value away">${away.goalsDiff !== undefined ? (away.goalsDiff > 0 ? '+' + away.goalsDiff : away.goalsDiff) : 'N/A'}</span>

                    <div class="team-stat-item">

                            <span class="team-stat-value away">${xG?.away?.final || 'N/A'}</span>
                        </div>
                    </div>
                    <div class="team-stat-item">
                        <span class="team-stat-label">Form xG</span>
                        <div class="team-stat-values">
                            <span class="team-stat-value home">${xG?.home?.formXG || 'N/A'}</span>
                            <span class="team-stat-value away">${xG?.away?.formXG || 'N/A'}</span>

        // Render Injury Impact
        function renderInjuryImpact(injuryImpact, fixture) {
            if (!injuryImpact) {
                return '<p style="color: var(--text-muted);">Data not available</p>';
            }

            const home = injuryImpact.home || {};
            const away = injuryImpact.away || {};

            const getImpactClass = (impact) => {
                if (!impact) return 'low';
                const imp = impact.toLowerCase();
                if (imp === 'severe') return 'severe';
                if (imp === 'moderate') return 'moderate';
                return 'low';
            };

            return `
                <div class="injury-impact-container">
                    <div class="injury-team">
                        <div class="injury-team-header">
                            <span class="injury-team-name home">${truncate(fixture.teams.home.name, 15)}</span>
                            <span class="injury-impact-badge ${getImpactClass(home.impact)}">${home.impact || 'LOW'}</span>
                        </div>
                        <div class="injury-stats">
                            <div class="injury-stat">
                                <span class="injury-stat-label">Players Out</span>
                                <span class="injury-stat-value">${home.totalOut || 0}</span>
                            </div>
                            <div class="injury-stat">
                                <span class="injury-stat-label">Key Players</span>
                                <span class="injury-stat-value">${home.keyPlayersOut || 0}</span>
                            </div>
                            <div class="injury-stat">
                                <span class="injury-stat-label">xG Impact</span>
                                <span class="injury-stat-value danger">-${home.reduction || 0}%</span>
                            </div>
                        </div>
                    </div>
                    <div class="injury-team">
                        <div class="injury-team-header">
                            <span class="injury-team-name away">${truncate(fixture.teams.away.name, 15)}</span>
                            <span class="injury-impact-badge ${getImpactClass(away.impact)}">${away.impact || 'LOW'}</span>
                        </div>
                        <div class="injury-stats">

                                <span class="injury-stat-label">Players Out</span>
                                <span class="injury-stat-value">${away.totalOut || 0}</span>

                            <div class="injury-stat">
                                <span class="injury-stat-label">xG Impact</span>
                                <span class="injury-stat-value danger">-${away.reduction || 0}%</span>

        // Render Head to Head
        function renderHeadToHead(h2h, homeName, awayName) {
            if (!h2h || h2h.total === 0) {
                return '<p style="color: var(--text-muted);">No head-to-head data available</p>';
            }

            const formatDate = (dateStr) => {
                const d = new Date(dateStr);
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' });
            };

            return `
                <div class="h2h-container">
                    <div class="h2h-summary">
                        <div class="h2h-stat">
                            <div class="h2h-stat-value home">${h2h.homeWins}</div>
                            <div class="h2h-stat-label">${truncate(homeName, 10)} Wins</div>
                        </div>
                        <div class="h2h-stat">
                            <div class="h2h-stat-value draw">${h2h.draws}</div>
                            <div class="h2h-stat-label">Draws</div>
                        </div>
                        <div class="h2h-stat">
                            <div class="h2h-stat-value away">${h2h.awayWins}</div>
                            <div class="h2h-stat-label">${truncate(awayName, 10)} Wins</div>
                        </div>
                    </div>
                    <div class="h2h-matches">
                        ${h2h.matches.slice(0, 5).map(m => `
                            <div class="h2h-match">
                                <div class="h2h-match-teams">
                                    <span>${truncate(m.homeTeam, 12)}</span>
                                    <span class="h2h-match-score">${m.score}</span>
                                    <span>${truncate(m.awayTeam, 12)}</span>
                                </div>
                                <span class="h2h-match-date">${formatDate(m.date)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

        // Generate Fun Facts
        function renderFunFacts(data, fixture) {
            const facts = [];
            const homeName = fixture.teams.home.name;
            const awayName = fixture.teams.away.name;

            // 1. H2H Dominance
            if (data.h2h && data.h2h.total >= 3) {
                const h2h = data.h2h;
                const homeWinRate = ((h2h.homeWins / h2h.total) * 100).toFixed(0);
                const awayWinRate = ((h2h.awayWins / h2h.total) * 100).toFixed(0);
                
                if (h2h.homeWins > h2h.awayWins + 1) {
                    facts.push({
                        icon: '🏆',
                        text: `<strong>${homeName}</strong> dominates this fixture with <span class="highlight">${h2h.homeWins} wins</span> in the last ${h2h.total} meetings (${homeWinRate}% win rate)`,
                        type: 'home-advantage'
                    });
                } else if (h2h.awayWins > h2h.homeWins + 1) {
                    facts.push({
                        icon: '🏆',
                        text: `<strong>${awayName}</strong> dominates this fixture with <span class="highlight">${h2h.awayWins} wins</span> in the last ${h2h.total} meetings (${awayWinRate}% win rate)`,
                        type: 'away-advantage'
                    });
                } else if (h2h.draws >= 3) {
                    facts.push({
                        icon: '🤝',
                        text: `This fixture loves draws! <span class="highlight">${h2h.draws} of the last ${h2h.total}</span> meetings ended level`,
                        type: 'neutral'
                    });
                }
            }

            // 2. Home/Away Form Streaks
            if (data.form?.home?.matches) {
                const homeMatches = data.form.home.matches;
                const homeHomeMatches = homeMatches.filter(m => m.venue === 'H');
                
                // Count consecutive unbeaten at home
                let homeUnbeaten = 0;
                for (const m of homeHomeMatches) {
                    if (m.result === 'W' || m.result === 'D') homeUnbeaten++;
                    else break;
                }
                
                if (homeUnbeaten >= 3) {
                    facts.push({
                        icon: '🏠',
                        text: `<strong>${homeName}</strong> are <span class="highlight">unbeaten in ${homeUnbeaten} home games</span>`,
                        type: 'home-advantage'
                    });
                }
                
                // Count consecutive wins
                let homeWinStreak = 0;
                for (const m of homeMatches) {
                    if (m.result === 'W') homeWinStreak++;
                    else break;
                }
                
                if (homeWinStreak >= 3) {
                    facts.push({
                        icon: '🔥',
                        text: `<strong>${homeName}</strong> are on a <span class="highlight">${homeWinStreak}-game winning streak!</span>`,
                        type: 'home-advantage'
                    });
                }
            }

            if (data.form?.away?.matches) {
                const awayMatches = data.form.away.matches;
                
                // Count consecutive wins
                let awayWinStreak = 0;
                for (const m of awayMatches) {
                    if (m.result === 'W') awayWinStreak++;
                    else break;
                }
                
                if (awayWinStreak >= 3) {
                    facts.push({
                        icon: '🔥',
                        text: `<strong>${awayName}</strong> are on a <span class="highlight">${awayWinStreak}-game winning streak!</span>`,
                        type: 'away-advantage'
                    });
                }
                
                // Away form
                const awayAwayMatches = awayMatches.filter(m => m.venue === 'A');
                let awayUnbeaten = 0;
                for (const m of awayAwayMatches) {
                    if (m.result === 'W' || m.result === 'D') awayUnbeaten++;
                    else break;
                }
                
                if (awayUnbeaten >= 3) {
                    facts.push({
                        icon: '✈️',
                        text: `<strong>${awayName}</strong> are <span class="highlight">unbeaten in ${awayUnbeaten} away games</span>`,
                        type: 'away-advantage'
                    });
                }
            }

            // 3. Top Scorer Fact
            if (data.squad?.home) {
                const topScorer = data.squad.home.reduce((best, p) => 
                    (p.goals || 0) > (best?.goals || 0) ? p : best, null);
                if (topScorer && topScorer.goals >= 5) {
                    facts.push({
                        icon: '⚽',
                        text: `<strong>${topScorer.name}</strong> leads ${homeName}'s attack with <span class="highlight">${topScorer.goals} goals</span> this season`,
                        type: 'home-advantage'
                    });
                }
            }

            if (data.squad?.away) {
                const topScorer = data.squad.away.reduce((best, p) => 
                    (p.goals || 0) > (best?.goals || 0) ? p : best, null);
                if (topScorer && topScorer.goals >= 5) {
                    facts.push({
                        icon: '⚽',
                        text: `<strong>${topScorer.name}</strong> leads ${awayName}'s attack with <span class="highlight">${topScorer.goals} goals</span> this season`,
                        type: 'away-advantage'
                    });
                }
            }

            // 4. Position-based facts
            if (data.standings?.home && data.standings?.away) {
                const posDiff = Math.abs(data.standings.home.position - data.standings.away.position);
                if (posDiff >= 10) {
                    const higher = data.standings.home.position < data.standings.away.position ? homeName : awayName;
                    const lower = data.standings.home.position < data.standings.away.position ? awayName : homeName;
                    facts.push({
                        icon: '📊',
                        text: `<span class="highlight">${posDiff} places</span> separate these teams! <strong>${higher}</strong> will be looking to assert their superiority`,
                        type: data.standings.home.position < data.standings.away.position ? 'home-advantage' : 'away-advantage'
                    });
                }
            }

            // 5. Clean sheet facts
            if (data.form?.home?.matches) {
                const cleanSheets = data.form.home.matches.filter(m => {
                    const goals = m.score?.split('-');
                    return goals && ((m.venue === 'H' && parseInt(goals[1]) === 0) || 
                                     (m.venue === 'A' && parseInt(goals[0]) === 0));
                }).length;
                
                if (cleanSheets >= 3) {
                    facts.push({
                        icon: '🧤',
                        text: `<strong>${homeName}</strong> have kept <span class="highlight">${cleanSheets} clean sheets</span> in their last 5 games`,
                        type: 'home-advantage'
                    });
                }
            }

            // 6. Goals galore
            if (data.form?.home?.matches) {
                const totalGoals = data.form.home.matches.slice(0, 5).reduce((sum, m) => {
                    const goals = m.score?.split('-');
                    return sum + (goals ? parseInt(goals[0]) + parseInt(goals[1]) : 0);
                }, 0);
                
                if (totalGoals >= 18) {
                    facts.push({
                        icon: '🎯',
                        text: `<strong>${homeName}</strong>'s last 5 games have seen <span class="highlight">${totalGoals} total goals</span> - expect entertainment!`,
                        type: 'neutral'
                    });
                }
            }

            if (facts.length === 0) {
                return '<p style="color: var(--text-muted);">Generating insights...</p>';
            }

            return `
                <div class="fun-facts-container">
                    ${facts.slice(0, 4).map(f => `
                        <div class="fun-fact ${f.type}">
                            <span class="fun-fact-icon">${f.icon}</span>
                            <span class="fun-fact-text">${f.text}</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Render Fixture Congestion / Fatigue Analysis
        function renderFixtureCongestion(congestionData, fixture) {
            if (!congestionData || (!congestionData.home && !congestionData.away)) {
                return '<p style="color: var(--text-muted);">Fixture congestion data not available</p>';
            }

            const formatDate = (dateStr) => {
                if (!dateStr) return 'N/A';
                const d = new Date(dateStr);
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            };

            const getCongestionClass = (level) => {
                if (!level) return 'low';
                return level.toLowerCase();
            };

            const getRotationIcon = (level) => {
                if (level === 'high') return '🔴';
                if (level === 'moderate') return '🟡';
                return '🟢';
            };

            const renderTeamCongestion = (congestion, teamName, teamClass) => {
                if (!congestion) {
                    return `
                        <div class="congestion-team">
                            <div class="congestion-team-header">
                                <span class="congestion-team-name ${teamClass}">${truncate(teamName, 15)}</span>
                                <span class="congestion-level-badge low">No Data</span>
                            </div>
                        </div>
                    `;
                }

                const fatigueFlags = [];
                if (congestion.isFatigued) fatigueFlags.push({ text: 'FATIGUED', type: 'warning' });
                if (congestion.hasQuickTurnaround) fatigueFlags.push({ text: 'QUICK TURNAROUND', type: 'warning' });
                if (congestion.hasBigMatchComing) fatigueFlags.push({ text: 'BIG MATCH SOON', type: 'danger' });

                return `
                    <div class="congestion-team">
                        <div class="congestion-team-header">
                            <span class="congestion-team-name ${teamClass}">${truncate(teamName, 15)}</span>
                            <span class="congestion-level-badge ${getCongestionClass(congestion.congestionLevel)}">
                                ${(congestion.congestionLevel || 'low').toUpperCase()}
                            </span>
                        </div>
                        <div class="congestion-stats">
                            <div class="congestion-stat">
                                <span class="congestion-stat-label">Days Since Last</span>
                                <span class="congestion-stat-value">${congestion.daysSinceLastMatch ?? 'N/A'}</span>
                            </div>
                            <div class="congestion-stat">
                                <span class="congestion-stat-label">Days Until Next</span>
                                <span class="congestion-stat-value">${congestion.daysUntilNextMatch ?? 'N/A'}</span>
                            </div>
                            <div class="congestion-stat">
                                <span class="congestion-stat-label">Games in 7 Days</span>
                                <span class="congestion-stat-value">${congestion.matchesInNext7Days ?? 0}</span>
                            </div>
                            <div class="congestion-stat">
                                <span class="congestion-stat-label">Games in 14 Days</span>
                                <span class="congestion-stat-value">${congestion.matchesInNext14Days ?? 0}</span>
                            </div>
                        </div>
                        
                        ${fatigueFlags.length > 0 ? `
                            <div class="fatigue-flags">
                                ${fatigueFlags.map(f => `
                                    <span class="fatigue-flag ${f.type}">⚠️ ${f.text}</span>
                                `).join('')}
                            </div>
                        ` : ''}
                        
                        ${congestion.rotationLikelihood && congestion.rotationLikelihood !== 'low' ? `
                            <div class="rotation-alert ${congestion.rotationLikelihood}">
                                <span class="rotation-alert-icon">${getRotationIcon(congestion.rotationLikelihood)}</span>
                                <span><strong>${congestion.rotationLikelihood.toUpperCase()} ROTATION RISK</strong>
                                ${congestion.rotationReason ? ` - ${congestion.rotationReason}` : ''}</span>
                            </div>
                        ` : ''}
                        
                        ${congestion.nextMatch ? `
                            <div class="upcoming-schedule">
                                <div class="upcoming-match">
                                    <span>
                                        <span class="upcoming-match-opponent">${congestion.nextMatch.opponent}</span>
                                        <span class="upcoming-match-comp"> (${congestion.nextMatch.competition})</span>
                                        ${congestion.nextMatchImportance !== 'standard' ? `
                                            <span class="big-match-flag">⭐ ${congestion.nextMatchImportance.replace('_', ' ').toUpperCase()}</span>
                                        ` : ''}
                                    </span>
                                    <span class="upcoming-match-date">${formatDate(congestion.nextMatch.date)}</span>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            };

            return `
                <div class="congestion-container">
                    ${renderTeamCongestion(congestionData.home, fixture.teams.home.name, 'home')}
                    ${renderTeamCongestion(congestionData.away, fixture.teams.away.name, 'away')}
                </div>
            `;
        }

        // Render goal distribution
        function renderGoalDistribution(dist, fixture, xG) {
            if (!dist || !dist.home || !dist.away) {
                return '<p style="color: var(--text-muted);">Data not available</p>';
            }
            
            const maxProb = Math.max(
                ...dist.home.map(d => d.probability),
                ...dist.away.map(d => d.probability)
            );
            
            const renderBars = (data, teamClass) => {
                return data.slice(0, 6).map(d => {
                    const heightPct = (d.probability / maxProb) * 100;
                    const probPct = (d.probability * 100).toFixed(1);
                    return `
                        <div class="goal-dist-bar">
                            <span class="goal-dist-bar-prob">${probPct}%</span>
                            <div class="goal-dist-bar-wrapper">
                                <div class="goal-dist-bar-fill ${teamClass}" style="height: ${heightPct}%;"></div>
                            </div>
                            <span class="goal-dist-bar-label">${d.goals}</span>
                        </div>
                    `;
                }).join('');
            };
            
            return `
                <div class="goal-dist-container">
                    <div class="goal-dist-team">
                        <div class="goal-dist-header">
                            <span class="goal-dist-team-name home">${truncate(fixture.teams.home.name, 20)}</span>
                            <span class="goal-dist-xg">xG: ${xG.home?.final || 'N/A'}</span>
                        </div>
                        <div class="goal-dist-bars">
                            ${renderBars(dist.home, 'home')}
                        </div>
                    </div>
                    <div class="goal-dist-team">
                        <div class="goal-dist-header">
                            <span class="goal-dist-team-name away">${truncate(fixture.teams.away.name, 20)}</span>
                            <span class="goal-dist-xg">xG: ${xG.away?.final || 'N/A'}</span>
                        </div>
                        <div class="goal-dist-bars">
                            ${renderBars(dist.away, 'away')}
                        </div>
                    </div>
                </div>
            `;
        }

        // Render scoreline chart
        function renderScorelineChart(canvasId, scorelines) {
            const ctx = document.getElementById(canvasId);
            if (!ctx || !scorelines) return;
            
            // Destroy existing chart
            if (state.charts[canvasId]) {
                state.charts[canvasId].destroy();
            }
            
            const top8 = scorelines.slice(0, 8);
            
            // Get computed styles for theme-aware colors
            const computedStyle = getComputedStyle(document.documentElement);
            const textPrimary = computedStyle.getPropertyValue('--text-primary').trim() || '#1a1a1a';
            const textMuted = computedStyle.getPropertyValue('--text-muted').trim() || '#8a8a8a';
            const bgCard = computedStyle.getPropertyValue('--bg-card').trim() || '#ffffff';
            const borderColor = computedStyle.getPropertyValue('--border-color').trim() || '#e5e5e5';
            const bgAccent = computedStyle.getPropertyValue('--bg-accent').trim() || '#e5e5e5';
            
            state.charts[canvasId] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: top8.map(s => s.score),
                    datasets: [{
                        label: 'Probability %',
                        data: top8.map(s => (s.probability * 100).toFixed(1)),
                        backgroundColor: top8.map((_, i) => i === 0 ? textPrimary : bgAccent),
                        borderColor: textPrimary,
                        borderWidth: 1,
                        borderRadius: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: {
                            top: 10
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: bgCard,
                            titleColor: textPrimary,
                            bodyColor: textMuted,
                            borderColor: borderColor,
                            borderWidth: 1
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: borderColor + '40' },
                            ticks: { 
                                color: textMuted,
                                font: { family: 'IBM Plex Mono' }
                            }
                        },
                        y: {
                            beginAtZero: true,
                            grace: '5%',
                            grid: { color: borderColor + '40' },
                            ticks: { 
                                color: textMuted,
                                font: { family: 'IBM Plex Mono' },
                                callback: (val) => val + '%'
                            }
                        }
                    }
                }
            });
        }

        // Format analysis text - Professional Report Style
        function formatAnalysis(text) {
            if (!text) return '<p style="color: var(--text-muted);">Analysis not available</p>';
            
            let formatted = text;
            
            // Remove the main title (# PROFESSIONAL MATCH ANALYSIS: etc)
            formatted = formatted.replace(/^#\s+.+?\n\n?/m, '');
            
            // Format markdown ## headers as section dividers
            formatted = formatted.replace(/##\s*(\d+\.)?\s*(.+?)[\n\r]/g, (match, num, title) => {
                return `</p></div><div class="analysis-section"><div class="analysis-section-title">${title.trim()}</div><p>`;
            });
            
            // Clean up starting tags if section starts at beginning
            formatted = formatted.replace(/^<\/p><\/div>/, '');
            
            // Format bold text
            formatted = formatted.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            
            // Format percentages with mono font
            formatted = formatted.replace(/(\d+(?:\.\d+)?%)/g, '<span style="font-family: \'IBM Plex Mono\', monospace; font-weight: 600; color: var(--text-primary);">$1</span>');
            
            // Format scores with mono font
            formatted = formatted.replace(/(\d+-\d+)/g, '<span style="font-family: \'IBM Plex Mono\', monospace; font-weight: 600; color: var(--text-primary);">$1</span>');
            
            // Format decimal numbers (like xG values)
            formatted = formatted.replace(/(\d+\.\d{2})/g, '<span style="font-family: \'IBM Plex Mono\', monospace; font-weight: 500;">$1</span>');
            
            // Format bullet points
            formatted = formatted.replace(/^[-•]\s*/gm, '• ');
            formatted = formatted.replace(/\n[-•]\s*/g, '<br>• ');
            
            // Format line breaks - double newlines become section breaks
            formatted = formatted.replace(/\n\n/g, '</p><p style="margin-top: 1rem;">');
            formatted = formatted.replace(/\n/g, '<br>');
            
            // Wrap in paragraph if not already
            if (!formatted.startsWith('<')) {
                formatted = '<p>' + formatted;
            }
            if (!formatted.endsWith('>')) {
                formatted = formatted + '</p>';
            }
            
            // Close any open sections at the end
            formatted += '</div>';
            
            // Clean up empty paragraphs
            formatted = formatted.replace(/<p><\/p>/g, '');
            formatted = formatted.replace(/<p>\s*<\/p>/g, '');
            
            return formatted;
        }

        // Render no prediction state
        function renderNoPrediction(fixture) {
            const main = document.getElementById('main-content');
            
            main.innerHTML = `
                <div class="match-header">
                    <div class="match-meta">
                        <div class="match-meta-item">
                            <span>📍</span>
                            <span>${fixture.fixture.venue?.name || 'TBD'}</span>
                        </div>
                        <div class="match-meta-item">
                            <span>📅</span>
                            <span>${new Date(fixture.fixture.date).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}</span>
                        </div>
                    </div>
                    <div class="match-teams-header">
                        <div class="match-team">
                            <img src="${fixture.teams.home.logo}" alt="" class="match-team-logo" onerror="this.style.display='none'">
                            <div class="match-team-name">${fixture.teams.home.name}</div>
                        </div>
                        <div class="match-vs">
                            <div class="match-vs-text">VS</div>
                        </div>
                        <div class="match-team">
                            <img src="${fixture.teams.away.logo}" alt="" class="match-team-logo" onerror="this.style.display='none'">
                            <div class="match-team-name">${fixture.teams.away.name}</div>
                        </div>
                    </div>
                </div>
                
                <div class="empty-state">
                    <div class="empty-state-icon">⏳</div>
                    <div class="empty-state-title">Prediction Not Available Yet</div>
                    <div class="empty-state-desc">The analysis for this match is being generated. Check back soon!</div>
                </div>
            `;
        }

        // Helper: truncate string
        function truncate(str, len) {
            if (!str) return '';
            return str.length > len ? str.substring(0, len) + '...' : str;
        }

        // Helper: Get prediction summary text
        function getPredictionSummary(outcomes, fixture) {
            if (!outcomes) return '';
            
            const home = parseFloat(outcomes.homeWin) || 0;
            const draw = parseFloat(outcomes.draw) || 0;
            const away = parseFloat(outcomes.awayWin) || 0;
            
            let favored = '';
            let prob = 0;
            let icon = '';
            
            if (home > draw && home > away) {
                favored = fixture.teams.home.name;
                prob = home;
                icon = '🏠';
            } else if (away > home && away > draw) {
                favored = fixture.teams.away.name;
                prob = away;
                icon = '✈️';
            } else {
                favored = 'Draw';
                prob = draw;
                icon = '🤝';
            }
            
            return `
                <div class="prediction-summary">
                    <span class="prediction-summary-text">
                        ${icon} <strong>${favored}</strong> favored at ${prob.toFixed(1)}%
                    </span>
                </div>
            `;
        }

        // Mobile sidebar toggle
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }

        // ═══════════════════════════════════════════════════════════════
        // THEME TOGGLE (DARK/LIGHT MODE)
        // ═══════════════════════════════════════════════════════════════
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            // Re-render charts with new theme colors
            if (state.prediction && state.selectedFixture) {
                const metrics = state.prediction.calculatedMetrics || {};
                const predictions = metrics.predictions || {};
                if (predictions.topScorelines) {
                    renderScorelineChart('scoreline-chart', predictions.topScorelines);
                }
            }
        }

        // Initialize theme from localStorage on page load
        function initializeTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');
            
            document.documentElement.setAttribute('data-theme', theme);
        }

        // Run theme initialization immediately
        initializeTheme();

        // ═══════════════════════════════════════════════════════════════
        // PREDICTION METHODOLOGY RENDERER
        // ═══════════════════════════════════════════════════════════════
        function renderMethodology(metrics, fixture, data) {
            if (!metrics || !metrics.predictions) {
                return '<p style="color: var(--text-muted);">Methodology details not available for this prediction.</p>';
            }

            const predictions = metrics.predictions || {};
            const xG = metrics.xG || {};
            const homeName = fixture.teams.home.name;
            const awayName = fixture.teams.away.name;
            const predictedScore = predictions.mostLikely?.score || 'N/A';
            const [homeGoals, awayGoals] = predictedScore !== 'N/A' ? predictedScore.split('-').map(Number) : [0, 0];

            // Extract lambda values from the data (xG.home/away are objects with 'final' property)
            const homeLambda = parseFloat(xG.home?.final) || parseFloat(xG.totalExpected) * 0.56 || 1.52;
            const awayLambda = parseFloat(xG.away?.final) || parseFloat(xG.totalExpected) * 0.44 || 1.18;

            // Model parameters from methodology (uses actual league averages)
            const methodology = metrics.methodology || {};
            const leagueAvgs = methodology.leagueAverages || {};
            const params = {
                leagueAvgHome: leagueAvgs.homeGoals || 1.52,
                leagueAvgAway: leagueAvgs.awayGoals || 1.18,
                leagueAvgTotal: leagueAvgs.totalGoals || 2.70,
                homeAdvantage: methodology.homeAdvantage || 1.12,
                dixonColesRho: methodology.dixonColesRho || -0.13,
                formWeight: parseFloat(methodology.formWeight) / 100 || 0.45,
                seasonWeight: 1 - (parseFloat(methodology.formWeight) / 100 || 0.45),
                marketCalibration: parseFloat(methodology.marketCalibrationWeight) / 100 || 0.25
            };

            // Calculate what the Poisson probability would be for the predicted score
            const factorial = (n) => n <= 1 ? 1 : n * factorial(n - 1);
            const poissonProb = (lambda, k) => (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k);
            
            const homeProb = poissonProb(homeLambda, homeGoals);
            const awayProb = poissonProb(awayLambda, awayGoals);
            const jointProb = homeProb * awayProb;

            // Dixon-Coles adjustment for low scores
            let dcAdjustment = 1.0;
            if (homeGoals <= 1 && awayGoals <= 1) {
                if (homeGoals === 0 && awayGoals === 0) {
                    dcAdjustment = 1 - homeLambda * awayLambda * params.dixonColesRho;
                } else if (homeGoals === 0 && awayGoals === 1) {
                    dcAdjustment = 1 + homeLambda * params.dixonColesRho;
                } else if (homeGoals === 1 && awayGoals === 0) {
                    dcAdjustment = 1 + awayLambda * params.dixonColesRho;
                } else if (homeGoals === 1 && awayGoals === 1) {
                    dcAdjustment = 1 - params.dixonColesRho;
                }
            }

            const adjustedProb = jointProb * dcAdjustment;
            const finalProbPercent = (adjustedProb * 100).toFixed(1);

            return `
                <div class="methodology-container">
                    <div class="methodology-intro">
                        Our prediction model combines <strong>xG-based Poisson distributions</strong> with 
                        <strong>Dixon-Coles correlation corrections</strong>, player availability analysis, 
                        exponential form decay weighting, and market calibration to produce the most likely scoreline.
                    </div>

                    <!-- League Averages Used -->
                    <div class="model-params" style="margin-bottom: 16px;">
                        <div class="model-param">
                            <span class="model-param-name">League Avg Home Goals</span>
                            <span class="model-param-value">${params.leagueAvgHome.toFixed(2)}</span>
                        </div>
                        <div class="model-param">
                            <span class="model-param-name">League Avg Away Goals</span>
                            <span class="model-param-value">${params.leagueAvgAway.toFixed(2)}</span>
                        </div>
                        <div class="model-param">
                            <span class="model-param-name">League Avg Total Goals</span>
                            <span class="model-param-value">${params.leagueAvgTotal.toFixed(2)}</span>
                        </div>
                    </div>

                    <!-- Core Formula -->
                    <div class="formula-block">
                        <div class="formula-title">Core Expected Goals Formula</div>
                        <div class="formula-math">
                            <span class="var">λ<sub>home</sub></span> <span class="symbol">=</span> 
                            <span class="num">${params.leagueAvgHome.toFixed(2)}</span> <span class="symbol">×</span> 
                            <span class="var">AttackStrength<sub>home</sub></span> <span class="symbol">×</span> 
                            <span class="var">DefenseWeakness<sub>away</sub></span> <span class="symbol">×</span> 
                            <span class="num">${params.homeAdvantage}</span>
                        </div>
                        <div class="formula-math" style="margin-top: 8px;">
                            <span class="var">λ<sub>away</sub></span> <span class="symbol">=</span> 
                            <span class="num">${params.leagueAvgAway.toFixed(2)}</span> <span class="symbol">×</span> 
                            <span class="var">AttackStrength<sub>away</sub></span> <span class="symbol">×</span> 
                            <span class="var">DefenseWeakness<sub>home</sub></span>
                        </div>
                    </div>

                    <!-- Step 1: Base Lambda Calculation -->
                    <div class="methodology-step">
                        <div class="methodology-step-header">
                            <span class="methodology-step-number">1</span>
                            <span class="methodology-step-title">Expected Goals (λ) Calculation</span>
                        </div>
                        <div class="methodology-step-content">
                            <p>We calculate expected goals for each team using attack strength, defense weakness, and home advantage.</p>
                            <div class="calc-breakdown">
                                <div class="calc-item">
                                    <span class="calc-item-label">${homeName} xG (λ<sub>home</sub>)</span>
                                    <span class="calc-item-result">${homeLambda.toFixed(2)}</span>
                                </div>
                                <div class="calc-item">
                                    <span class="calc-item-label">${awayName} xG (λ<sub>away</sub>)</span>
                                    <span class="calc-item-result">${awayLambda.toFixed(2)}</span>
                                </div>
                                <div class="calc-item">
                                    <span class="calc-item-label">Total Expected Goals</span>
                                    <span class="calc-item-result">${(homeLambda + awayLambda).toFixed(2)}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Step 2: Poisson Distribution -->
                    <div class="methodology-step">
                        <div class="methodology-step-header">
                            <span class="methodology-step-number">2</span>
                            <span class="methodology-step-title">Poisson Probability Distribution</span>
                        </div>
                        <div class="methodology-step-content">
                            <p>Using the Poisson formula P(X=k) = (λ<sup>k</sup> × e<sup>-λ</sup>) / k!, we calculate the probability of each scoreline.</p>
                            <div class="formula-block" style="margin: 12px 0;">
                                <div class="formula-math">
                                    <span class="var">P(${homeName}=${homeGoals})</span> <span class="symbol">=</span> 
                                    <span class="num">${(homeProb * 100).toFixed(2)}%</span>
                                </div>
                                <div class="formula-math" style="margin-top: 4px;">
                                    <span class="var">P(${awayName}=${awayGoals})</span> <span class="symbol">=</span> 
                                    <span class="num">${(awayProb * 100).toFixed(2)}%</span>
                                </div>
                                <div class="formula-math" style="margin-top: 4px;">
                                    <span class="var">P(${predictedScore})</span> <span class="symbol">=</span> 
                                    <span class="num">${(jointProb * 100).toFixed(2)}%</span>
                                    <span style="color: var(--text-muted); font-size: 11px; margin-left: 8px;">(before correction)</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Step 3: Dixon-Coles Correction -->
                    <div class="methodology-step">
                        <div class="methodology-step-header">
                            <span class="methodology-step-number">3</span>
                            <span class="methodology-step-title">Dixon-Coles Low-Score Correlation</span>
                        </div>
                        <div class="methodology-step-content">
                            <p>Standard Poisson assumes independence between home and away goals. Dixon-Coles corrects this for low-scoring outcomes (0-0, 1-0, 0-1, 1-1) using correlation factor ρ = ${params.dixonColesRho}.</p>
                            <div class="calc-breakdown">
                                <div class="calc-item">
                                    <span class="calc-item-label">Adjustment Factor (τ)</span>
                                    <span class="calc-item-result">${dcAdjustment.toFixed(4)}</span>
                                </div>
                                <div class="calc-item">
                                    <span class="calc-item-label">Adjusted Probability</span>
                                    <span class="calc-item-result">${finalProbPercent}%</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Step 4: Additional Adjustments -->
                    <div class="methodology-step">
                        <div class="methodology-step-header">
                            <span class="methodology-step-number">4</span>
                            <span class="methodology-step-title">Form, Player & Market Adjustments</span>
                        </div>
                        <div class="methodology-step-content">
                            <p>Final λ values are adjusted for recent form (exponential decay), player availability (xG impact), and calibrated against market odds.</p>
                            <div class="model-params">
                                <div class="model-param">
                                    <span class="model-param-name">Form Weight</span>
                                    <span class="model-param-value">${Math.round(params.formWeight * 100)}%</span>
                                </div>
                                <div class="model-param">
                                    <span class="model-param-name">Season Stats Weight</span>
                                    <span class="model-param-value">${Math.round(params.seasonWeight * 100)}%</span>
                                </div>
                                <div class="model-param">
                                    <span class="model-param-name">Home Advantage</span>
                                    <span class="model-param-value">×${params.homeAdvantage}</span>
                                </div>
                                <div class="model-param">
                                    <span class="model-param-name">Market Calibration</span>
                                    <span class="model-param-value">${Math.round(params.marketCalibration * 100)}%</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Final Result -->
                    <div class="formula-block" style="background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(59, 130, 246, 0.1)); border-color: var(--accent-primary);">
                        <div class="formula-title" style="color: var(--accent-primary);">Predicted Scoreline</div>
                        <div class="formula-math">
                            <span class="var" style="font-size: 20px;">${homeName}</span> 
                            <span class="num" style="font-size: 24px; margin: 0 12px;">${predictedScore}</span> 
                            <span class="var" style="font-size: 20px;">${awayName}</span>
                        </div>
                        <div style="text-align: center; margin-top: 8px; color: var(--text-muted); font-size: 12px;">
                            Model Probability: <strong style="color: var(--accent-primary);">${predictions.mostLikely?.probability || finalProbPercent}%</strong>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
